<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>HRM Minh An — logo chữ MA</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #006865;
      }

      .frame {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: #006865;
      }

      .mark {
        width: 72%;
        height: 72%;
        border-radius: 22%;
        background: #ffffff;
        display: grid;
        place-items: center;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      }

      .letters {
        margin: 0;
        color: #006865;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 38vmin;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="mark">
        <p class="letters">MA</p>
      </div>
    </div>
  </body>
</html>
