# Codemagic — build iOS HRM → TestFlight
# Bundle ID: com.minhan.hrm.hrmMobile
#
# Trước khi chạy workflow lần đầu:
# 1. Codemagic → Teams → Integrations → App Store Connect (tên integration khớp bên dưới)
# 2. Code signing identities → Fetch profile App Store cho com.minhan.hrm.hrmMobile
# 3. Đặt APP_STORE_APPLE_ID = số Apple ID của app trên App Store Connect (App Information)
# 4. Đặt GoogleService-Info.plist vào mobile/ios/Runner/ (hoặc Codemagic env/file)
# 5. Ghim đúng phiên bản Flutter đang dùng local (flutter --version)
#
# Android AAB không build trên Codemagic — build local rồi tải lên Play Console.

workflows:
  ios-testflight:
    name: HRM iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Đổi nếu tên integration trên Codemagic khác (ERP đang dùng MinhAnAppStore)
      app_store_connect: MinhAnAppStore
    environment:
      # Ghim đúng bản local (Dart 3.12.2) — đừng để "stable".
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.minhan.hrm.hrmMobile
        # Số App ID trên App Store Connect (App Information → Apple ID).
        APP_STORE_APPLE_ID: "6811757349"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.minhan.hrm.hrmMobile
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd mobile/ios
          pod install
      - name: Build IPA
        script: |
          cd mobile
          # Phiên bản lấy từ pubspec.yaml (dòng "version: 1.0.6+2"): tên bản = 1.0.6,
          # số build = 2. Không ghim cứng --build-name nữa, mỗi lần tăng version trong
          # pubspec là Codemagic tự theo.
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${VERSION_LINE%%+*}
          PUBSPEC_BUILD=${VERSION_LINE##*+}
          # Số build mới nhất trên TestFlight. Tuỳ chọn đúng là --platform; bản cũ dùng
          # --type không tồn tại nên lệnh lỗi, rơi về 0 và tải lên với build 1 trùng bản
          # trước. Chỉ lấy dòng toàn chữ số để thông báo lỗi của CLI không lọt vào phép tính.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null | grep -Eo '^[0-9]+$' | tail -1)
          LATEST=${LATEST:-0}
          NEXT=$((LATEST + 1))
          # Lấy số lớn hơn giữa pubspec và TestFlight+1 để luôn tăng, kể cả khi quên bump.
          if [ "$PUBSPEC_BUILD" -gt "$NEXT" ]; then BUILD_NUMBER=$PUBSPEC_BUILD; else BUILD_NUMBER=$NEXT; fi
          echo "Build name $BUILD_NAME, build number $BUILD_NUMBER (pubspec $PUBSPEC_BUILD, TestFlight latest $LATEST)"
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Chưa submit App Review — chỉ TestFlight
        submit_to_app_store: false
